
name: 更新市場資料

on:
  schedule:
    # 🇯🇵 日本股市
    # 台灣時間 08:07～14:37
    - cron: "7,37 0-6 * * 1-5"

    # 🇪🇺 歐洲 + 🇺🇸 美國
    # UTC 07:07～20:37
    # 台灣時間 15:07～04:37（隔日）
    # 涵蓋歐洲夏令/冬令及美國夏令/冬令
    - cron: "7,37 7-20 * * 1-5"

    # 台灣時間 05:07
    # 美國冬令收盤後最後一次快照
    - cron: "7 21 * * 1-5"

    # 🇺🇸 美國收盤後日結
    # 台灣時間 07:07（週二～週六）
    - cron: "7 23 * * 1-5"

  # 程式及設定異動時重新抓取
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "config/**"
      - ".github/workflows/update.yml"

  # 手動執行
  workflow_dispatch:
    inputs:
      mode:
        description: "daily＝寫入歷史；snapshot＝只更新最新價"
        type: choice
        default: daily
        options:
          - daily
          - snapshot

permissions:
  contents: write   # 日更把資料 commit 回 main
  pages: write      # 佈署到 GitHub Pages
  id-token: write   # actions/deploy-pages 需要

concurrency:
  group: eco-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 決定模式
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "mode=$INPUT_MODE" >> "$GITHUB_OUTPUT"

          elif [ "$EVENT_NAME" = "push" ]; then
            echo "mode=daily" >> "$GITHUB_OUTPUT"

          elif [ "$SCHEDULE" = "7 23 * * 1-5" ]; then
            echo "mode=daily" >> "$GITHUB_OUTPUT"

          else
            echo "mode=snapshot" >> "$GITHUB_OUTPUT"
          fi

      # 抓取資料
      - name: 抓資料並產生網站資料
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          python -m pipeline.run --mode "${{ steps.mode.outputs.mode }}"
          code=$?

          echo "exit code: $code"

          # 0 = 成功
          # 2 = 部分來源失敗，仍可部署
          # 其他 = 全面失敗，不部署
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            exit "$code"
          fi

          if [ "$code" -eq 2 ]; then
            echo "::warning::部分資料來源失敗，詳見 data/site/meta.json"
          fi

      # 只有 daily 才 commit
      - name: 推回 main（僅日結）
        if: steps.mode.outputs.mode == 'daily'
        run: |
          git config user.name "eco-bot"
          git config user.email "eco-bot@users.noreply.github.com"

          git add data/series data/site

          if git diff --cached --quiet; then
            echo "資料無變動"
            exit 0
          fi

          git commit -m "data: daily $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')"

          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
              && git push origin "HEAD:${GITHUB_REF_NAME}" \
              && exit 0

            echo "推送失敗，重試 $i"
            sleep 5
          done

          exit 1

      # 組出 Pages 網站
      - name: 組出要佈署的網站
        run: |
          mkdir -p _site/data

          cp index.html _site/
          touch _site/.nojekyll

          cp -r data/site _site/data/site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # 部署網站
  deploy:
    needs: update
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
